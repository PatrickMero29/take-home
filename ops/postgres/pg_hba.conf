# Unix sockets are private to the PostgreSQL container. No application receives
# that socket or its administrator secret volume. Every network connection is
# encrypted and password-authenticated; cleartext network connections are denied.
local all all trust
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
